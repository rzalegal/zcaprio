[workspace]
members = [
    "crates/zkp-primitives",
    "crates/age-credential-circuit",
    "crates/zkp-lab",
]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
ark-bn254 = "0.6"
ark-crypto-primitives = "0.6"
ark-ed-on-bn254 = "0.6"
ark-groth16 = "0.6"
ark-r1cs-std = "0.6"
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
